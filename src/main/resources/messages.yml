prefix: "<gradient:#FFD700:#FFA500><b>GlowCrafts</b></gradient> <dark_gray>»</dark_gray> "

command:
  no-permission: "<red>У вас недостаточно прав для выполнения этой команды."
  players-only: "<red>Данная команда доступна только игрокам."
  usage: "<gray>Использование: <yellow>/glowcrafts <create|list|reload></yellow>"
  create-usage: "<gray>Использование: <yellow>/glowcrafts create <shaped|shapeless|anvil|furnace></yellow>"
  unknown-type: "<red>Неизвестный тип рецепта. Доступные: <yellow>shaped, shapeless, anvil, furnace</yellow>"
  reloaded: "<green>Конфигурация и <white><count></white> рецептов успешно перезагружены."

craft:
  no-permission: "<red>У вас нет права на создание этого предмета."
  not-enough-money: "<red>Для создания этого предмета требуется <gold><amount>$</gold>."
  not-enough-level: "<red>Для создания требуется <green><level> ур.</green> опыта."
  crafted: "<green>Предмет успешно создан."

anvil:
  no-permission: "<red>У вас нет права на обработку этого рецепта в наковальне."
  not-enough-money: "<red>Для наковальни требуется <gold><amount>$</gold>."
  not-enough-level: "<red>Недостаточно уровней опыта для наковальни (требуется <green><level></green>)."
  processed: "<green>Предмет успешно обработан на наковальне."

gui:
  main:
    title: "<gradient:#FFD700:#FFA500><b>GlowCrafts — Главное меню</b></gradient>"
    list-button: "<gold><b>Список всех рецептов</b></gold>"
    list-lore:
      - "<gray>Просмотр, редактирование и удаление"
      - "<gray>всех созданных кастомных рецептов."
      - ""
      - "<yellow>▶ Нажмите для открытия</yellow>"
    create-shaped-button: "<aqua><b>Создать: Верстак (Сетка)</b></aqua>"
    create-shaped-lore:
      - "<gray>Создание рецепта 3x3 с фиксированным"
      - "<gray>расположением ингредиентов."
      - ""
      - "<yellow>▶ Нажмите для создания</yellow>"
    create-shapeless-button: "<aqua><b>Создать: Верстак (Бесформенный)</b></aqua>"
    create-shapeless-lore:
      - "<gray>Создание рецепта верстака с произвольным"
      - "<gray>расположением ингредиентов (до 9 шт)."
      - ""
      - "<yellow>▶ Нажмите для создания</yellow>"
    create-anvil-button: "<light_purple><b>Создать: Наковальня</b></light_purple>"
    create-anvil-lore:
      - "<gray>Создание рецепта объединения предметов"
      - "<gray>с настройкой требуемых уровней опыта."
      - ""
      - "<yellow>▶ Нажмите для создания</yellow>"
    create-furnace-button: "<red><b>Создать: Печь</b></red>"
    create-furnace-lore:
      - "<gray>Создание рецепта плавки предметов"
      - "<gray>с настройкой времени и опыта."
      - ""
      - "<yellow>▶ Нажмите для создания</yellow>"
    reload-button: "<green><b>Перезагрузить плагин</b></green>"
    reload-lore:
      - "<gray>Перечитать рецепты и сообщения с диска."
      - ""
      - "<yellow>▶ Нажмите для перезагрузки</yellow>"

  list:
    title: "<gradient:#FFD700:#FFA500><b>Рецепты (Стр. <page>/<total_pages>)</b></gradient>"
    item-lore:
      - "<dark_gray>──────────────────────────</dark_gray>"
      - "<gray>Тип: <yellow><type></yellow>"
      - "<gray>ID: <white><id></white>"
      - "<gray>Право: <aqua><permission></aqua>"
      - "<gray>Уровень: <green><level></green>"
      - "<gray>Цена: <gold><money>$</gold>"
      - "<gray>Точное NBT: <white><exact_meta></white>"
      - "<dark_gray>──────────────────────────</dark_gray>"
      - "<yellow>ЛКМ</yellow> <gray>— Редактировать рецепт</gray>"
      - "<red>Shift + ПКМ</red> <gray>— <red>Удалить рецепт</red></gray>"
    empty: "<gray>Рецептов пока нет. Создайте первый рецепт в главном меню!"
    prev-page: "<yellow>◀ Предыдущая страница</yellow>"
    next-page: "<yellow>Следующая страница ▶</yellow>"
    back-button: "<red>◀ Назад в главное меню</red>"
    filter-all: "<gold>Фильтр: Все рецепты</gold>"
    filter-crafting: "<aqua>Фильтр: Только Верстак</aqua>"
    filter-anvil: "<light_purple>Фильтр: Только Наковальня</light_purple>"
    filter-furnace: "<red>Фильтр: Только Печь</red>"

  editor:
    title-shaped: "<gradient:#FFD700:#FFA500><b>Редактор: Верстак (Сетка)</b></gradient>"
    title-shapeless: "<gradient:#FFD700:#FFA500><b>Редактор: Верстак (Бесформенный)</b></gradient>"
    title-anvil: "<gradient:#FFD700:#FFA500><b>Редактор: Наковальня</b></gradient>"
    title-furnace: "<gradient:#FFD700:#FFA500><b>Редактор: Печь</b></gradient>"
    result-label: "<gold><b>Результат крафта</b></gold>"
    result-lore:
      - "<gray>Положите сюда предмет, который"
      - "<gray>игрок получит в результате крафта."
    grid-label: "<yellow><b>Сетка ингредиентов</b></yellow>"
    anvil-base-label: "<aqua><b>Базовый предмет (Слот 1)</b></aqua>"
    anvil-sacrifice-label: "<light_purple><b>Дополнительный предмет (Слот 2)</b></light_purple>"
    furnace-input-label: "<red><b>Входной предмет для плавки</b></red>"
    id-button: "<gold><b>Идентификатор (ID):</b> <white><id></white></gold>"
    id-lore:
      - "<gray>Уникальный ID рецепта для сохранения."
      - "<yellow>▶ Нажмите для изменения через чат</yellow>"
    permission-button: "<aqua><b>Право (Permission):</b> <white><permission></white></aqua>"
    permission-lore:
      - "<gray>Право для доступа к этому крафту."
      - "<gray>Если пусто — доступно всем игрокам."
      - "<yellow>▶ Нажмите для изменения через чат</yellow>"
    level-button: "<green><b>Стоимость в уровнях (EXP):</b> <white><level></white></green>"
    level-lore:
      - "<gray>Количество уровней опыта, требуемых для крафта."
      - "<yellow>▶ Нажмите для изменения через чат</yellow>"
    money-button: "<gold><b>Стоимость в валюте:</b> <white><money>$</white></gold>"
    money-lore:
      - "<gray>Денежная сумма (Vault), списываемая за крафт."
      - "<yellow>▶ Нажмите для изменения через чат</yellow>"
    exact-meta-button: "<light_purple><b>Точное совпадение NBT/Мета:</b> <white><exact_meta></white></light_purple>"
    exact-meta-lore:
      - "<gray>Включено: ингредиенты должны иметь"
      - "<gray>точно такое же название, лор и NBT."
      - "<gray>Выключено: проверяется только тип предмета."
      - "<yellow>▶ Нажмите для переключения</yellow>"
    furnace-time-button: "<red><b>Время плавки (секунды):</b> <white><time></white></red>"
    furnace-time-lore:
      - "<gray>Длительность переплавки одного предмета."
      - "<yellow>▶ Нажмите для изменения через чат</yellow>"
    furnace-exp-button: "<green><b>Опыт за плавку:</b> <white><exp></white></green>"
    furnace-exp-lore:
      - "<gray>Количество опыта, выпадающего при переплавке."
      - "<yellow>▶ Нажмите для изменения через чат</yellow>"
    save-button: "<green><b>✔ Сохранить рецепт</b></green>"
    save-lore:
      - "<gray>Сохраняет рецепт и мгновенно активирует"
      - "<gray>его на сервере без перезапуска."
      - ""
      - "<yellow>▶ Нажмите для сохранения</yellow>"
    cancel-button: "<red><b>✖ Отмена</b></red>"
    cancel-lore:
      - "<gray>Закрыть редактор без сохранения."
      - "<yellow>▶ Нажмите для выхода</yellow>"

prompt:
  enter-id: "<yellow>Введите в чат уникальный ID рецепта (на латинице без пробелов) или напишите <red>cancel</red> для отмены:</yellow>"
  enter-permission: "<yellow>Введите в чат право доступа (или <green>none</green> для сброса) или напишите <red>cancel</red> для отмены:</yellow>"
  enter-level: "<yellow>Введите в чат необходимое количество уровней опыта (число от 0) или напишите <red>cancel</red> для отмены:</yellow>"
  enter-money: "<yellow>Введите в чат стоимость в деньгах (число от 0) или напишите <red>cancel</red> для отмены:</yellow>"
  enter-furnace-time: "<yellow>Введите в чат время плавки в секундах (от 1 до 3600) или напишите <red>cancel</red> для отмены:</yellow>"
  enter-furnace-exp: "<yellow>Введите в чат опыт за плавку (например 0.7 или 2.0) или напишите <red>cancel</red> для отмены:</yellow>"
  cancelled: "<gray>Ввод отменен.</gray>"
  timeout: "<red>Время ожидания ввода истекло.</red>"
  invalid-number: "<red>Ошибка: введено некорректное число."
  invalid-id: "<red>Ошибка: ID должен содержать только строчные латинские буквы, цифры, дефис и подчеркивание."
  id-exists: "<red>Ошибка: рецепт с таким ID уже существует."
  updated: "<green>Параметр успешно обновлен.</green>"

notification:
  recipe-saved: "<green>Рецепт <gold><id></gold> успешно сохранен и зарегистрирован!"
  recipe-deleted: "<red>Рецепт <gold><id></gold> успешно удален."
  error-missing-result: "<red>Нельзя сохранить рецепт без предмета-результата!"
  error-missing-ingredients: "<red>Нельзя сохранить рецепт без ингредиентов!"
  error-save-failed: "<red>Произошла ошибка при сохранении рецепта на диск."

common:
  yes: "<green>Да</green>"
  no: "<red>Нет</red>"
  none: "<gray>Отсутствует</gray>"
